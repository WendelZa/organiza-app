<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Organiza APP</title>
<!-- Fonte Inter (requisito do usuário) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- ECharts (gráficos) e Supabase JS v2 (nuvem) via CDN -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ================= RESET & BASE ================= */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:#f1f5f9;
    color:#0f172a;
    font-size:15px;
    line-height:1.45;
    padding-bottom:96px; /* espaço para barra fixa de botões */
  }
  input,select,button,textarea{font-family:inherit;font-size:15px}
  button{cursor:pointer;border:none;background:none}
  :root{
    --teal-900:#134e4a;--teal-800:#0f766e;--teal-600:#0d9488;--teal-500:#14b8a6;
    --teal-200:#99f6e4;--teal-50:#f0fdfa;
    --red:#e11d48;--red-soft:#fff1f2;
    --green:#059669;--green-soft:#ecfdf5;
    --border:#e2e8f0;--muted:#64748b;--bg:#f1f5f9;
  }
  /* ================= APP SHELL (mobile-first, centralizado) ================= */
  .app-shell{max-width:480px;margin:0 auto;position:relative;min-height:100vh}
  /* ================= HEADER (gradiente teal) ================= */
  .app-header{
    background:linear-gradient(135deg,#0f766e 0%,#0d9488 55%,#14b8a6 100%);
    color:#fff;padding:20px 18px 22px;border-radius:0 0 22px 22px;
    position:relative;box-shadow:0 4px 14px rgba(13,148,136,.25);
  }
  .header-top{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .header-user{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .avatar{
    width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);
    border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:20px;color:#fff;flex-shrink:0;
  }
  .greeting-small{font-size:13px;opacity:.85;font-weight:500}
  .greeting-name{font-size:22px;font-weight:800;line-height:1.15;word-break:break-word}
  .header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;color:#fff;
    transition:background .15s;
  }
  .icon-btn:active{background:rgba(255,255,255,.35)}
  .icon-btn svg{width:19px;height:19px}
  .pro-badge{
    background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f;
    font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.5px;
    box-shadow:0 2px 6px rgba(245,158,11,.4);
  }
  .sync-indicator{
    position:absolute;top:10px;right:16px;font-size:11px;font-weight:600;
    background:rgba(255,255,255,.2);padding:3px 9px;border-radius:999px;
    backdrop-filter:blur(4px);display:none;
  }
  .sync-indicator.visible{display:block}
  .sync-indicator.syncing{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  /* ================= TABS (pills) ================= */
  .tabs-wrap{padding:14px 14px 4px;display:flex;flex-wrap:wrap;gap:8px}
  .tab-pill{
    padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;
    background:#fff;color:var(--teal-800);border:1.5px solid var(--teal-200);
    transition:all .15s;white-space:nowrap;
  }
  .tab-pill.active{background:var(--teal-600);color:#fff;border-color:var(--teal-600);
    box-shadow:0 3px 10px rgba(13,148,136,.35)}
  /* ================= CARDS ================= */
  .content{padding:10px 14px 20px}
  .card{
    background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  .card h3{font-size:16px;font-weight:700;margin-bottom:12px;color:#0f172a;display:flex;align-items:center;gap:8px}
  .card h3 .h3-right{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
  /* Card Saldo do mês (gradiente teal) */
  .balance-card{
    background:linear-gradient(135deg,#0f766e,#0d9488 60%,#14b8a6);
    color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:14px;
    box-shadow:0 6px 18px rgba(13,148,136,.3);position:relative;overflow:hidden;
  }
  .balance-card::after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;
    border-radius:50%;background:rgba(255,255,255,.08)}
  .balance-label{font-size:14px;font-weight:600;opacity:.9;margin-bottom:4px}
  .balance-value{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
  .balance-fx{font-size:12.5px;opacity:.85;margin-bottom:16px}
  .balance-row{display:flex;gap:12px}
  .balance-col{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
  .balance-col .lbl{font-size:12px;opacity:.85;font-weight:500}
  .balance-col .val{font-size:18px;font-weight:700;margin:2px 0}
  .balance-col .delta{font-size:11.5px;font-weight:600;opacity:.95}
  .delta-up{color:#bbf7d0}.delta-down{color:#fecdd3}
  /* ================= BOTÕES FIXOS (+ Receita / − Despesa) ================= */
  .bottom-bar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(241,245,249,.98) 70%,rgba(241,245,249,0));
    display:flex;gap:10px;z-index:40;
  }
  .btn{
    flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .1s, box-shadow .15s;color:#fff;
  }
  .btn:active{transform:scale(.97)}
  .btn-receita{background:linear-gradient(135deg,#0d9488,#14b8a6);box-shadow:0 4px 12px rgba(13,148,136,.35)}
  .btn-despesa{background:linear-gradient(135deg,#e11d48,#f43f5e);box-shadow:0 4px 12px rgba(225,29,72,.3)}
  .btn-block{width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:15px;margin-top:6px}
  .btn-teal{background:var(--teal-600);color:#fff}
  .btn-outline{background:#fff;color:var(--teal-800);border:1.5px solid var(--teal-200)}
  .btn-ghost{background:transparent;color:var(--muted)}
  .btn-danger{background:var(--red);color:#fff}
  .btn-amber{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#78350f}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  /* ================= FORMULÁRIOS ================= */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;
    background:#f8fafc;color:#0f172a;outline:none;transition:border-color .15s;
  }
  .field input:focus,.field select:focus{border-color:var(--teal-500);background:#fff}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1}
  .check-row{display:flex;align-items:center;gap:9px;padding:8px 2px;font-size:14px;font-weight:500;color:#334155}
  .check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal-600)}
  .toggle{position:relative;width:46px;height:26px;background:#cbd5e1;border-radius:999px;transition:background .2s;flex-shrink:0;cursor:pointer}
  .toggle.on{background:var(--teal-500)}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on::after{transform:translateX(20px)}
  .setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
  .setting-row:last-child{border-bottom:none}
  .setting-row .s-label{font-weight:600;font-size:14.5px}
  .setting-row .s-sub{font-size:12px;color:var(--muted);margin-top:2px}
  /* Toggle Receita/Despesa no modal */
  .type-toggle{display:flex;background:#f1f5f9;border-radius:12px;padding:4px;margin-bottom:16px}
  .type-toggle button{flex:1;padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);transition:all .15s}
  .type-toggle button.active.despesa{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(225,29,72,.3)}
  .type-toggle button.active.receita{background:var(--teal-600);color:#fff;box-shadow:0 2px 8px rgba(13,148,136,.3)}
  /* ================= LISTAS ================= */
  .list-item{
    display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);
  }
  .list-item:last-child{border-bottom:none}
  .li-icon{
    width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0;background:var(--teal-50);color:var(--teal-800);
  }
  .li-icon.red{background:var(--red-soft);color:var(--red)}
  .li-icon.green{background:var(--green-soft);color:var(--green)}
  .li-main{flex:1;min-width:0}
  .li-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .li-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .li-value{font-weight:700;font-size:14.5px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .li-value.receita{color:var(--green)}
  .li-value.despesa{color:var(--red)}
  .tag{display:inline-block;background:#f1f5f9;color:#475569;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-right:4px}
  .empty-state{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
  .search-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fff;margin-bottom:10px;outline:none}
  .search-input:focus{border-color:var(--teal-500)}
  .filter-row{display:flex;gap:8px;margin-bottom:10px}
  .filter-row select{flex:1;padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:13.5px;font-weight:500;color:#334155}
  /* Progress bar (metas / orçamento) */
  .progress{height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden;margin-top:8px}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#0d9488,#14b8a6);transition:width .4s}
  .progress-fill.warn{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
  .progress-fill.over{background:linear-gradient(90deg,#e11d48,#f43f5e)}
  /* Conquistas */
  .ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ach{
    text-align:center;padding:12px 6px;border-radius:12px;background:#f8fafc;border:1px solid var(--border);
    opacity:.45;filter:grayscale(.8);
  }
  .ach.unlocked{opacity:1;filter:none;background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#fcd34d}
  .ach .ach-ico{font-size:26px;margin-bottom:4px}
  .ach .ach-nome{font-size:11px;font-weight:700;color:#334155;line-height:1.2}
  /* Cartões de crédito */
  .credit-card{
    background:linear-gradient(135deg,#0f766e,#0d9488 60%,#14b8a6);color:#fff;
    border-radius:16px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;
    box-shadow:0 6px 16px rgba(13,148,136,.28);
  }
  .credit-card::after{content:'';position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1)}
  .cc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .cc-nome{font-weight:700;font-size:16px}
  .cc-bandeira{font-size:11px;font-weight:700;background:rgba(255,255,255,.25);padding:3px 9px;border-radius:999px}
  .cc-limite-label{font-size:11px;opacity:.85}
  .cc-limite{font-size:20px;font-weight:800;margin:2px 0 8px;font-variant-numeric:tabular-nums}
  .cc-dates{font-size:11.5px;opacity:.9;display:flex;gap:14px}
  /* ================= MODAL ================= */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;
    display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);
  }
  .modal-overlay.show{display:flex;animation:fadeIn .2s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));
    animation:slideUp .25s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .modal h2{font-size:19px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .modal-center{align-items:center;padding:20px}
  .modal-center .modal{border-radius:20px;max-width:360px;animation:popIn .2s ease-out}
  @keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-actions{display:flex;gap:10px;margin-top:14px}
  .modal-actions .btn{flex:1;padding:12px}
  /* ================= TOAST ================= */
  .toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:92%;max-width:420px;pointer-events:none}
  .toast{
    background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .25s ease-out;pointer-events:auto;
    display:flex;align-items:center;gap:8px;
  }
  .toast.success{background:#065f46}.toast.error{background:#991b1b}.toast.info{background:#1e3a8a}
  .toast.out{animation:toastOut .3s forwards}
  @keyframes toastIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes toastOut{to{transform:translateY(-20px);opacity:0}}
  /* ================= SPLASH / LOGIN / LOCK ================= */
  .fullscreen{
    position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;
  }
  .splash{background:linear-gradient(135deg,#0f766e,#0d9488 55%,#14b8a6);color:#fff;text-align:center}
  .splash-logo{width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;margin-bottom:20px;animation:logoPop .6s ease-out}
  @keyframes logoPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .splash-logo svg{width:44px;height:44px;color:#fff}
  .splash h1{font-size:26px;font-weight:800;margin-bottom:6px}
  .splash p{font-size:14px;opacity:.85}
  .splash.hide{animation:fadeOut .4s forwards}
  @keyframes fadeOut{to{opacity:0;visibility:hidden}}
  .login-screen{background:linear-gradient(160deg,#0f766e,#0d9488 50%,#14b8a6);color:#fff}
  .login-card{background:#fff;color:#0f172a;border-radius:20px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .login-card h2{font-size:22px;font-weight:800;margin-bottom:4px;color:var(--teal-800)}
  .login-card .sub{font-size:13px;color:var(--muted);margin-bottom:20px}
  .login-link{text-align:center;margin-top:14px;font-size:13.5px;color:var(--teal-800);font-weight:600;cursor:pointer}
  .offline-link{text-align:center;margin-top:10px;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline}
  .cloud-badge{display:inline-flex;align-items:center;gap:5px;background:var(--teal-50);color:var(--teal-800);
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:14px}
  /* Tela de PIN (lock) */
  .lock-screen{background:linear-gradient(160deg,#0f766e,#0d9488 55%,#14b8a6);color:#fff}
  .lock-title{font-size:20px;font-weight:700;margin:14px 0 4px}
  .lock-sub{font-size:13px;opacity:.85;margin-bottom:26px}
  .pin-dots{display:flex;gap:14px;margin-bottom:30px}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.7);transition:all .15s}
  .pin-dot.filled{background:#fff;transform:scale(1.1)}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px}
  .pin-key{
    width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;
    font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;
    margin:0 auto;transition:background .12s,transform .1s;
  }
  .pin-key:active{background:rgba(255,255,255,.35);transform:scale(.94)}
  .pin-key.blank{background:transparent;pointer-events:none}
  .pin-key svg{width:26px;height:26px}
  .lock-error{color:#fecdd3;font-size:13px;font-weight:600;height:18px;margin-top:14px}
  .bio-btn{margin-top:22px;display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;font-weight:600;
    background:rgba(255,255,255,.15);padding:10px 18px;border-radius:999px}
  /* Gráficos */
  .chart-box{width:100%;height:300px}
  .chart-box.tall{height:320px}
  /* Família */
  .invite-code-box{background:var(--teal-50);border:1.5px dashed var(--teal-500);border-radius:12px;
    padding:14px;text-align:center;margin:10px 0}
  .invite-code{font-size:28px;font-weight:800;letter-spacing:6px;color:var(--teal-800);font-variant-numeric:tabular-nums}
  .family-member{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;font-weight:600}
  .shared-badge{font-size:11px;background:var(--teal-50);color:var(--teal-800);padding:1px 6px;border-radius:6px;font-weight:700}
  /* Insights IA */
  .insights-card{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fcd34d;border-radius:14px;padding:14px;font-size:13.5px;line-height:1.6;color:#78350f;white-space:pre-wrap}
  .locked-feature{opacity:.55;position:relative}
  .lock-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.6);border-radius:16px;cursor:pointer;z-index:5}
  .lock-overlay .lock-chip{background:#0f172a;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
  /* Impressão (PDF) */
  @media print{
    .bottom-bar,.tabs-wrap,.app-header .icon-btn,.sync-indicator,.no-print{display:none!important}
    body{background:#fff;padding-bottom:0}
    .app-shell{max-width:100%}
    .card,.balance-card{break-inside:avoid;box-shadow:none}
    .app-header{background:#0f766e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
    .balance-card,.credit-card{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  .muted{color:var(--muted);font-size:12.5px}
  .section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 10px}
  .inline-svg{width:16px;height:16px;vertical-align:middle}
</style>
</head>
<body>

<!-- ============ SPLASH SCREEN ============ -->
<div id="splash" class="fullscreen splash">
  <div class="splash-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
    </svg>
  </div>
  <h1>Organiza APP</h1>
  <p>Controle suas receitas, despesas e metas</p>
</div>

<!-- ============ TELA DE LOGIN (nuvem) ============ -->
<div id="loginScreen" class="fullscreen login-screen" style="display:none">
  <div class="login-card">
    <span class="cloud-badge">
      <svg class="inline-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
      Modo nuvem
    </span>
    <h2 id="loginTitle">Entrar</h2>
    <p class="sub" id="loginSub">Acesse com sua conta para sincronizar</p>

function fmtNum(v){ return new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0); }

function mesKey(d){ const dt = d?new Date(d):new Date(); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
function mesLabel(key){

function confirmar(titulo, msg, textoSim='Confirmar', perigo=true){

/* ==================== 5. CONQUISTAS (achievements) ==================== */
const ACHIEVEMENTS = [

/* ==================== 6. CÁLCULOS FINANCEIROS ==================== */
function txAtivas(){ return S.transactions.filter(t=>!t.deleted_at); }
function somaMes(tipo, key=mesKey()){
  return txAtivas().filter(t=>t.tipo===tipo && mesKey(t.data)===key).reduce((a,t)=>a+Number(t.valor),0);
}
function somaMesAnterior(tipo){
  const d = new Date(); d.setMonth(d.getMonth()-1);
  return somaMes(tipo, mesKey(d));
}
function deltaPct(atual, ant){
  if (!ant || ant <= 0) return null;
  return ((atual - ant)/ant)*100;
}

/* ==================== 7. SYNC BIDIRECIONAL (Supabase) ====================
   Estratégia: last-write-wins via updated_at + tombstone via deleted_at.
   - pullFromCloud(): baixa linhas com updated_at > ultimoSync, mescla, aplica tombstones.
   - pushToCloud(): upsert de todas as linhas locais (incluindo tombstones) p/ propagar mudanças.
   Mapeamento localStorage → tabela (nomes exatos do schema.sql). */
const TABLE_MAP = [
  {key:'transactions', table:'transactions'},
  {key:'budgets',      table:'budgets'},
  {key:'goals',        table:'goals'},
  {key:'bills',        table:'bills'},
  {key:'marketItems',  table:'market_items'},
  {key:'categories',   table:'categories'},
  {key:'recurrents',   table:'recurrents'},
  {key:'cards',        table:'cards'}
];
function setSyncStatus(texto, sincronizando){
  const el = $('syncIndicator');
  if (!supabase || !currentUser){ el.classList.remove('visible'); return; }
  el.textContent = texto;
  el.classList.add('visible');
  el.classList.toggle('syncing', !!sincronizando);
}
// Prepara uma linha local para o Supabase: garante user_id, timestamps.
function prepararLinha(row){
  const r = Object.assign({}, row);
  r.user_id = currentUser.id;
  if (!r.created_at) r.created_at = nowISO();
  if (!r.updated_at) r.updated_at = nowISO();
  // tags: Postgres espera array text[]; se for string, converte.
  if (r.tags && typeof r.tags === 'string') { try { r.tags = JSON.parse(r.tags); } catch(e){ r.tags = [r.tags]; } }
  if (r.tags && !Array.isArray(r.tags)) r.tags = [String(r.tags)];
  return r;
}
async function pushToCloud(){
  if (!supabase || !currentUser) return;
  setSyncStatus('Sincronizando…', true);
  try {
    for (const {key, table} of TABLE_MAP) {
      const linhas = (S[key]||[]).map(prepararLinha);
      if (!linhas.length) continue;
      const {error} = await supabase.from(table).upsert(linhas, {onConflict:'id'});
      if (error) console.warn('push erro', table, error);
    }
    // Perfil (tabela profiles, linha única por usuário).
    const perfilRow = {
      id: currentUser.id,
      nome: S.profile.nome,
      biometria_ativado: !!S.profile.biometria,
      cambio_usd: Number(S.settings.cambioUsd)||5,
      cambio_eur: Number(S.settings.cambioEur)||5.4,
      dias_aviso_contas: Number(S.settings.diasAviso)||3,
      notificacoes_ativadas: !!S.settings.notificacoes,
      updated_at: nowISO()
    };
    await supabase.from('profiles').upsert(perfilRow);
    setSyncStatus('☁ Sincronizado', false);
  } catch(e){
    console.warn('pushToCloud', e);
    setSyncStatus('☁ Offline', false);
  }
}
async function pullFromCloud(){
  if (!supabase || !currentUser) return;
  setSyncStatus('Sincronizando…', true);
  try {
    const desde = metaSync.lastSync || '1970-01-01T00:00:00Z';
    for (const {key, table} of TABLE_MAP) {
      // RLS já filtra por usuário / família. Aqui baixamos apenas o que mudou.
      let q = supabase.from(table).select('*').gt('updated_at', desde);
      const {data, error} = await q;
      if (error){ console.warn('pull erro', table, error); continue; }
      if (!data || !data.length) continue;
      data.forEach(row=>{
        const idx = S[key].findIndex(x=>x.id===row.id);
        if (row.deleted_at){
          // Tombstone: remover localmente (mantemos registro da exclusão).
          if (idx>=0) S[key].splice(idx,1);
          return;
        }
        const limpa = Object.assign({}, row);
        delete limpa.user_id; // não guardamos user_id localmente
        if (idx>=0){
          // Last-write-wins: mantém a linha com updated_at mais recente.
          const local = S[key][idx];
          if (new Date(row.updated_at) >= new Date(local.updated_at||0)) S[key][idx] = limpa;
        } else {
          S[key].push(limpa);
        }
      });
    }
    // Perfil
    try {
      const {data: pf} = await supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
      if (pf){
        S.profile.nome = pf.nome || S.profile.nome;
        S.profile.biometria = !!pf.biometria_ativado;
        S.settings.cambioUsd = Number(pf.cambio_usd)||5;
        S.settings.cambioEur = Number(pf.cambio_eur)||5.4;
        S.settings.diasAviso = Number(pf.dias_aviso_contas)||3;
        S.settings.notificacoes = !!pf.notificacoes_ativadas;
      }
    } catch(e){}
    metaSync.lastSync = nowISO();
    saveState();
    setSyncStatus('☁ Sincronizado', false);
  } catch(e){
    console.warn('pullFromCloud', e);
    setSyncStatus('☁ Offline', false);
  }
}
async function syncFull(){
  if (!supabase || !currentUser) return;
  await pullFromCloud();
  await pushToCloud();
  await carregarAssinatura();
  await carregarFamilia();
  renderAll();
}

function aposAutenticacao(){

  } else {

}
function mostrarLock(){
  $('lockScreen').style.display = 'flex';
  $('app').style.display = 'none';
  $('lockAvatar').textContent = (S.profile.nome||'A').charAt(0).toUpperCase();
  $('lockTitle').textContent = 'Olá, ' + (S.profile.nome||'Amigo') + '!';
  pinInput = ''; atualizarPinDots(); $('lockError').textContent = '';
  // Tenta biometria automaticamente se ativada e suportada (fallback suave).
  if (S.profile.biometria && window.PublicKeyCredential) tentarBiometria();
  else $('bioBtn').style.display = 'none';
}
function esconderLock(){ $('lockScreen').style.display = 'none'; }
function atualizarPinDots(){
  document.querySelectorAll('#pinDots .pin-dot').forEach((d,i)=> d.classList.toggle('filled', i < pinInput.length));
}
$('pinPad').addEventListener('click', e=>{
  const btn = e.target.closest('.pin-key'); if (!btn) return;
  const v = btn.dataset.pin; if (!v) return;
  if (v==='del'){ pinInput = pinInput.slice(0,-1); }
  else if (pinInput.length < 4){ pinInput += v; }
  atualizarPinDots();
  $('lockError').textContent = '';
  if (pinInput.length === 4){
    setTimeout(()=>{
      if (pinInput === S.profile.pin){ esconderLock(); mostrarApp(); }
      else { $('lockError').textContent = 'PIN incorreto. Tente novamente.'; pinInput=''; atualizarPinDots(); }
    }, 150);
  }
});
// Biometria via WebAuthn — fallback suave: qualquer erro apenas mantém o PIN.
async function tentarBiometria(){
  $('bioBtn').style.display = 'inline-flex';
  try {
    // Em produção, o credential id seria persistido. Aqui usamos uma abordagem
    // soft: se o dispositivo suporta e o usuário confirma, desbloqueia.
    if (!navigator.credentials || !PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) throw 0;
    const disponivel = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if (!disponivel) throw 0;
    $('bioBtn').addEventListener('click', async ()=>{
      try {
        // Requisição mínima; sem credencial cadastrada prévia, o sistema pode
        // falhar — por isso o fallback é sempre o PIN.
        const assert = await navigator.credentials.get({publicKey:{
          challenge: new Uint8Array(32), timeout: 30000,
          allowCredentials: [], userVerification:'required'
        }});
        if (assert){ esconderLock(); mostrarApp(); }
      } catch(e){ toast('Use o PIN para desbloquear.','info'); }
    }, {once:true});
  } catch(e){ $('bioBtn').style.display = 'none'; }
}
$('lockBtn').addEventListener('click', ()=>{
  if (S.profile.pin) mostrarLock();
  else toast('Nenhum PIN configurado. Defina em Ajustes.','info');
});

/* ==================== 10. MODO FAMÍLIA (households) ==================== */
function gerarCodigoConvite(){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let c = ''; for (let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
async function carregarFamilia(){
  householdId = null; householdInvite = null;
  if (!supabase || !currentUser) return;
  try {
    const {data: membros} = await supabase.from('household_members').select('household_id').eq('user_id', currentUser.id);
    if (membros && membros.length){
      householdId = membros[0].household_id;
      const {data: hh} = await supabase.from('households').select('invite_code,nome').eq('id', householdId).maybeSingle();
      if (hh) householdInvite = hh.invite_code;
    }
  } catch(e){ console.warn('familia', e); }
}
async function criarFamilia(){
  if (!supabase || !currentUser){ toast('Crie uma família no modo nuvem.','error'); return; }
  const code = gerarCodigoConvite();
  try {
    const id = uid();
    const {error: e1} = await supabase.from('households').insert({id, nome:'Minha Família', invite_code: code, created_by: currentUser.id});
    if (e1) throw e1;
    const {error: e2} = await supabase.from('household_members').insert({household_id: id, user_id: currentUser.id, role:'admin'});
    if (e2) throw e2;
    householdId = id; householdInvite = code;
    toast('Família criada! Compartilhe o código.','success');
    renderAll();
  } catch(e){ toast('Erro ao criar família: '+(e.message||''),'error'); }
}
async function entrarFamilia(codigo){
  if (!supabase || !currentUser){ toast('Entre na nuvem para usar família.','error'); return; }
  codigo = (codigo||'').trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(codigo)){ toast('Código deve ter 6 letras/números.','error'); return; }
  try {
    const {data: hh, error} = await supabase.from('households').select('id').eq('invite_code', codigo).maybeSingle();
    if (error || !hh){ toast('Código inválido.','error'); return; }
    await supabase.from('household_members').insert({household_id: hh.id, user_id: currentUser.id, role:'membro'});
    householdId = hh.id; householdInvite = codigo;
    toast('Você entrou na família!','success');
    await syncFull();
  } catch(e){ toast('Erro ao entrar: '+(e.message||''),'error'); }
}

async function gerarInsights(){
  const btn = $('insightsBtn');
  if (!isConfigured(CONFIG.AI_FUNCTION_URL)){
    // TODO(usuário): implante a edge function 'ai-insights' no Supabase e cole a URL no CONFIG.
    toast('Configure a URL da edge function de IA no CONFIG.','error',4500);
    return;
  }
  const categoriasTop = {};
  txAtivas().filter(t=>t.tipo==='despesa' && mesKey(t.data)===mesKey()).forEach(t=>{
    categoriasTop[t.categoria] = (categoriasTop[t.categoria]||0)+Number(t.valor);
  });
  const top = Object.entries(categoriasTop).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([c,v])=>({categoria:c, valor:v}));
  const payload = {
    resumo: {
      receitas: somaMes('receita'),
      despesas: somaMes('despesa'),
      categoriasTop: top,
      saldo: somaMes('receita') - somaMes('despesa'),
      mes: mesLabel(mesKey())
    }
  };
  if (btn) { btn.disabled = true; btn.textContent = '💡 Analisando…'; }
  try {
    const resp = await fetch(CONFIG.AI_FUNCTION_URL, {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+CONFIG.SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const dados = await resp.json().catch(()=>({}));
    const texto = dados.texto || dados.insight || dados.message || JSON.stringify(dados);
    abrirModal(`
      <h2>💡 Insights com IA</h2>
      <div class="insights-card">${escapeHtml(texto)}</div>
      <button class="btn-block btn-outline" id="fecharInsights">Fechar</button>
    `);
    $('fecharInsights').onclick = fecharModal;
  } catch(e){
    toast('Erro ao buscar insights: '+(e.message||''),'error');
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = '💡 Insights com IA'; }
  }
}

/* ---------- ABA RESUMO ---------- */
function htmlResumo(){
  const mesAtual = mesKey();
  const rec = somaMes('receita'), des = somaMes('despesa');
  const saldo = rec - des;
  const recAnt = somaMesAnterior('receita'), desAnt = somaMesAnterior('despesa');
  const dRec = deltaPct(rec, recAnt), dDes = deltaPct(des, desAnt);
  const usd = saldo / (Number(S.settings.cambioUsd)||5);
  const eur = saldo / (Number(S.settings.cambioEur)||5.4);
  const deltaHtml = (d, tipo)=>{
    if (d === null) return '<span class="delta">— sem base</span>';
    const up = d >= 0;
    // Para despesa, subir é ruim; para receita, subir é bom.
    const cls = (tipo==='receita' ? up : !up) ? 'delta-up' : 'delta-down';
    const seta = up ? '▲' : '▼';
    return `<span class="delta ${cls}">${seta} ${Math.abs(d).toFixed(0)}% vs ${mesLabel(prevMesKey())}</span>`;
  };
  return `
    <div class="balance-card">
      <div class="balance-label">Saldo do mês (${mesLabel(mesAtual)})</div>
      <div class="balance-value">${fmt(saldo)}</div>
      <div class="balance-fx">≈ $${fmtNum(usd)} · €${fmtNum(eur)} · 1 USD = R$${fmtNum(S.settings.cambioUsd)} · 1 EUR = R$${fmtNum(S.settings.cambioEur)}</div>
      <div class="balance-row">
        <div class="balance-col">
          <div class="lbl">Receitas</div>
          <div class="val">${fmt(rec)}</div>
          ${deltaHtml(dRec,'receita')}
        </div>
        <div class="balance-col">
          <div class="lbl">Despesas</div>
          <div class="val">${fmt(des)}</div>
          ${deltaHtml(dDes,'despesa')}
        </div>
      </div>
    </div>
    <button class="btn-block btn-outline" id="insightsBtn" style="margin-bottom:14px">💡 Insights com IA</button>
    <div class="card">
      <h3>Despesas por categoria <span class="h3-right">${mesLabel(mesAtual)}</span></h3>
      <div id="chartPie" class="chart-box"></div>
    </div>
    <div class="card ${isPro?'':'locked-feature'}">
      <h3>Receitas vs Despesas (6 meses)</h3>
      <div id="chartBar" class="chart-box tall"></div>
      ${isPro?'':`<div class="lock-overlay" id="lockRelatorios"><span class="lock-chip">
        <svg class="inline-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Relatório Pro</span></div>`}
    </div>
    ${S.goals.filter(g=>!g.deleted_at).length ? `
    <div class="card">
      <h3>Metas em andamento</h3>
      ${S.goals.filter(g=>!g.deleted_at).slice(0,3).map(g=>{
        const pct = Math.min(100, (g.valor_atual/g.valor_alvo)*100);
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:600">
            <span>${g.icone||'🎯'} ${escapeHtml(g.nome)}</span><span>${pct.toFixed(0)}%</span>
          </div>
          <div class="progress"><div class="progress-fill" style="width:${pct}%;background:${g.cor||'#14b8a6'}"></div></div>
        </div>`;
      }).join('')}
    </div>`:''}
  `;
}
function prevMesKey(){ const d=new Date(); d.setMonth(d.getMonth()-1); return mesKey(d); }

function initCharts(){
  if (typeof echarts === 'undefined'){
    const p = $('chartPie'); if (p) p.innerHTML = '<div class="empty-state">Gráficos indisponíveis (sem internet).</div>';
    const b = $('chartBar'); if (b) b.innerHTML = '<div class="empty-state">Gráficos indisponíveis.</div>';
    return;
  }
  // Pizza: despesas por categoria no mês.
  const cat = {};
  txAtivas().filter(t=>t.tipo==='despesa' && mesKey(t.data)===mesKey()).forEach(t=>{
    cat[t.categoria] = (cat[t.categoria]||0)+Number(t.valor);
  });
  const pieEl = $('chartPie');
  if (pieEl){
    if (chartPie){ try{chartPie.dispose();}catch(e){} }
    chartPie = echarts.init(pieEl);
    const dados = Object.entries(cat).map(([name,value])=>({name, value, itemStyle:{color:catCor(name)}}));
    if (!dados.length){
      pieEl.innerHTML = '<div class="empty-state">Sem despesas no mês</div>';
    } else {
      chartPie.setOption({
        tooltip:{trigger:'item', formatter:p=>`${p.name}: ${fmt(p.value)} (${p.percent}%)`},
        legend:{bottom:0, textStyle:{fontSize:11, color:'#64748b'}, type:'scroll'},
        series:[{type:'pie', radius:['42%','68%'], center:['50%','42%'],
          label:{formatter:'{b}', fontSize:10, color:'#475569'},
          labelLine:{length:6, length2:6},
          data:dados}]
      });
    }
  }
  // Barras/linha: receitas vs despesas últimos 6 meses.
  const barEl = $('chartBar');
  if (barEl && isPro){
    if (chartBar){ try{chartBar.dispose();}catch(e){} }
    chartBar = echarts.init(barEl);
    const meses = []; const receitas = []; const despesas = [];
    for (let i=5;i>=0;i--){
      const d = new Date(); d.setMonth(d.getMonth()-i);
      const k = mesKey(d);
      meses.push(mesLabel(k));
      receitas.push(Number(somaMes('receita',k).toFixed(2)));
      despesas.push(Number(somaMes('despesa',k).toFixed(2)));
    }
    chartBar.setOption({
      tooltip:{trigger:'axis', valueFormatter:v=>fmt(v)},
      legend:{top:0, textStyle:{fontSize:11}},
      grid:{left:50, right:14, top:36, bottom:26},
      xAxis:{type:'category', data:meses, axisLabel:{fontSize:11, color:'#64748b'}, axisLine:{lineStyle:{color:'#e2e8f0'}}},
      yAxis:{type:'value', axisLabel:{fontSize:10, color:'#94a3b8', formatter:v=>'R$'+(v>=1000?(v/1000).toFixed(1)+'k':v)}, splitLine:{lineStyle:{color:'#f1f5f9'}}},
      series:[
        {name:'Receitas', type:'bar', data:receitas, itemStyle:{color:'#0d9488', borderRadius:[6,6,0,0]}, barMaxWidth:22},
        {name:'Despesas', type:'bar', data:despesas, itemStyle:{color:'#e11d48', borderRadius:[6,6,0,0]}, barMaxWidth:22},
        {name:'Saldo', type:'line', data:receitas.map((r,i)=>Number((r-despesas[i]).toFixed(2))), smooth:true, lineStyle:{color:'#f59e0b', width:3}, itemStyle:{color:'#f59e0b'}, symbolSize:7}
      ]
    });
  }
}

    b.parentElement.querySelectorAll('button').forEach(x=> x.className = (x.dataset.mtipo===modalTipo ? 'active '+modalTipo : ''));
    const sel = $('txCat');
    sel.innerHTML = S.categories.filter(c=>c.tipo===modalTipo).map(c=>`<option value="${escapeHtml(c.nome)}">${c.icone} ${escapeHtml(c.nome)}</option>`).join('');
  });
  $('txCancelar').onclick = fecharModal;
  $('txSalvar').onclick = salvarTransacao;
}
function salvarTransacao(){
  const desc = $('txDesc').value.trim();
  const valor = parseFloat($('txValor').value);
  const data = $('txData').value;
  if (!desc || !valor || valor<=0 || !data){ toast('Preencha descrição, valor e data.','error'); return; }
  const cat = $('txCat').value;
  const tags = ($('txTags').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const recorrente = $('txRecorrente').checked;
  const tx = {
    id: uid(), tipo: modalTipo, descricao: desc, valor: valor, data: data,
    categoria: cat, tags: tags, recorrente: recorrente,
    household_id: (householdId && $('txFamiliar') && $('txFamiliar').checked) ? householdId : null,
    created_at: nowISO(), updated_at: nowISO(), deleted_at: null
  };
  S.transactions.push(tx);
  if (recorrente){
    S.recurrents.push({
      id: uid(), descricao: desc, valor: valor, categoria: cat, tipo: modalTipo,
      dia_vencimento: Math.min(31, Math.max(1, new Date(data).getDate())),
      ativo: true, created_at: nowISO(), updated_at: nowISO(), deleted_at: null
    });
  }
  persistAll();
  fecharModal();
  toast((modalTipo==='receita'?'Receita':'Despesa')+' registrada!','success');
  renderAll();
}
$('btnReceita').addEventListener('click', ()=>abrirModalTransacao('receita'));

function htmlOrcamento(){

  txAtivas().filter(t=>t.tipo==='despesa' && mesKey(t.data)===mes).forEach(t=>{ gastos[t.categoria]=(gastos[t.categoria]||0)+Number(t.valor); });
  const rows = S.budgets.filter(b=>!b.deleted_at && b.mes===mes);
  return `
    <div class="card">
      <h3>Orçamento — ${mesLabel(mes)}</h3>
      ${rows.length ? rows.map(b=>{
        const usado = gastos[b.categoria]||0;

        const cls = pct>=100?'over':(pct>=80?'warn':'');
        return `<div style="margin-bottom:14px">

/* ==================== 14. EVENTOS DOS CONTEÚDOS (bind pós-render) ==================== */
function bindContentEvents(){
  // Resumo
  const ib = $('insightsBtn'); if (ib) ib.onclick = gerarInsights;
  const lr = $('lockRelatorios'); if (lr) lr.onclick = ()=>abrirModalPro('Relatórios avançados de 6 meses são exclusivos do Pro.');
  // Transações
  const atm = $('abrirTxModal'); if (atm) atm.onclick = ()=>abrirModalTransacao('despesa');
  const btx = $('buscaTx'); if (btx){ btx.oninput = e=>{ buscaTx = e.target.value; $('listaTxCard').innerHTML = htmlListaTx(); }; }
  const ft = $('filtroTipo'); if (ft) ft.onchange = e=>{ filtroTipo=e.target.value; $('listaTxCard').innerHTML=htmlListaTx(); };
  const fp = $('filtroPeriodo'); if (fp) fp.onchange = e=>{ filtroPeriodo=e.target.value; $('listaTxCard').innerHTML=htmlListaTx(); };
  document.querySelectorAll('[data-tx]').forEach(el=> el.onclick = async ()=>{
    const id = el.dataset.tx;
    const ok = await confirmar('Excluir transação?','Esta ação não pode ser desfeita.','Excluir',true);
    if (ok){
      const idx = S.transactions.findIndex(t=>t.id===id);
      if (idx>=0){ S.transactions[idx].deleted_at = nowISO(); S.transactions[idx].updated_at = nowISO(); }
      persistAll(); toast('Transação excluída.','success'); renderAll();
    }
  });
  // Orçamento
  const ao = $('addOrcamento'); if (ao) ao.onclick = modalOrcamento;
  // Metas
  const am = $('addMeta'); if (am) am.onclick = modalMeta;
  document.querySelectorAll('[data-addmeta]').forEach(b=> b.onclick = async ()=>{
    const id = b.dataset.addmeta;
    const v = promptValor('Quanto adicionar à meta?');
    if (v && v>0){ const g = S.goals.find(x=>x.id===id); if(g){ g.valor_atual = Math.min(g.valor_alvo, g.valor_atual+v); g.updated_at=nowISO(); persistAll(); toast('Valor adicionado!','success'); renderAll(); } }
  });
  document.querySelectorAll('[data-delmeta]').forEach(b=> b.onclick = async ()=>{
    const ok = await confirmar('Excluir meta?','Confirma a exclusão desta meta?','Excluir',true);
    if (ok){ const g=S.goals.find(x=>x.id===b.dataset.delmeta); if(g){g.deleted_at=nowISO();g.updated_at=nowISO();} persistAll(); renderAll(); }
  });
  // Contas
  const ac = $('addConta'); if (ac) ac.onclick = modalConta;
  document.querySelectorAll('[data-pagar]').forEach(b=> b.onclick = ()=>{
    const c = S.bills.find(x=>x.id===b.dataset.pagar); if(c){ c.status='pago'; c.updated_at=nowISO(); persistAll(); toast('Conta marcada como paga.','success'); renderAll(); }
  });
  // Mercado
  const amk = $('addMkt'); if (amk) amk.onclick = ()=>{
    const nome = $('mktNome').value.trim(); const qtd = parseInt($('mktQtd').value)||1;
    if (!nome){ toast('Informe o nome do item.','error'); return; }
    S.marketItems.push({id:uid(), nome, quantidade:qtd, comprado:false, created_at:nowISO(), updated_at:nowISO(), deleted_at:null});
    persistAll(); renderAll();
  };
  document.querySelectorAll('[data-mktcheck]').forEach(cb=> cb.onchange = ()=>{
    const m = S.marketItems.find(x=>x.id===cb.dataset.mktcheck); if(m){ m.comprado=cb.checked; m.updated_at=nowISO(); persistAll(); renderAll(); }
  });
  document.querySelectorAll('[data-delmkt]').forEach(b=> b.onclick = ()=>{
    const m = S.marketItems.find(x=>x.id===b.dataset.delmkt); if(m){ m.deleted_at=nowISO(); m.updated_at=nowISO(); persistAll(); renderAll(); }
  });
  // Cartões
  const addc = $('addCard'); if (addc) addc.onclick = salvarCartao;
  const upc = $('upgradeCard'); if (upc) upc.onclick = ()=>abrirModalPro('Cartões ilimitados são exclusivos do plano Pro.');
  document.querySelectorAll('[data-delcard]').forEach(b=> b.onclick = async ()=>{
    const ok = await confirmar('Remover cartão?','Confirma a remoção?','Remover',true);
    if (ok){ const c=S.cards.find(x=>x.id===b.dataset.delcard); if(c){c.deleted_at=nowISO();c.updated_at=nowISO();} persistAll(); renderAll(); }
  });
  // Ajustes
  const an = $('altNome'); if (an) an.onclick = ()=>{
    abrirModal(`<h2>Alterar nome</h2>
      <div class="field"><label>Seu nome</label><input id="novoNome" value="${escapeHtml(S.profile.nome||'')}"></div>
      <button class="btn-block btn-teal" id="salvarNome">Salvar</button>
      <button class="btn-block btn-ghost" id="cancelarNome">Cancelar</button>`);
    $('cancelarNome').onclick = fecharModal;
    $('salvarNome').onclick = ()=>{ const n=$('novoNome').value.trim(); if(n){ S.profile.nome=n; persistAll(); fecharModal(); toast('Nome atualizado.','success'); renderAll(); } };
  };
  const ap = $('altPin'); if (ap) ap.onclick = modalPin;
  const tb = $('toggleBio'); if (tb) tb.onclick = ()=>{
    if (!window.PublicKeyCredential){ toast('Este dispositivo não suporta biometria.','info'); return; }
    S.profile.biometria = !S.profile.biometria; persistAll(); renderAll();
    toast(S.profile.biometria?'Biometria ativada (fallback: PIN).':'Biometria desativada.','success');
  };
  const tn = $('toggleNotif'); if (tn) tn.onclick = async ()=>{
    S.settings.notificacoes = !S.settings.notificacoes;
    if (S.settings.notificacoes && 'Notification' in window){
      try { const perm = await Notification.requestPermission(); if (perm!=='granted'){ S.settings.notificacoes=false; toast('Permissão de notificação negada.','error'); } }
      catch(e){}
    }
    persistAll(); renderAll();
  };
  const da = $('diasAviso'); if (da) da.onchange = ()=>{ S.settings.diasAviso = parseInt(da.value)||3; persistAll(); };
  const sc = $('salvarCambio'); if (sc) sc.onclick = ()=>{
    S.settings.cambioUsd = parseFloat($('cambioUsd').value)||5;
    S.settings.cambioEur = parseFloat($('cambioEur').value)||5.4;
    persistAll(); toast('Câmbio salvo.','success'); renderAll();
  };
  const cf = $('criarFamilia'); if (cf) cf.onclick = criarFamilia;
  const ef = $('entrarFamilia'); if (ef) ef.onclick = ()=> entrarFamilia($('codigoFamilia').value);
  const sf = $('sairFamilia'); if (sf) sf.onclick = async ()=>{
    const ok = await confirmar('Sair da família?','Você deixará de ver transações compartilhadas.','Sair',true);
    if (ok && supabase && currentUser && householdId){
      try { await supabase.from('household_members').delete().eq('household_id', householdId).eq('user_id', currentUser.id); }catch(e){}
      householdId=null; householdInvite=null; toast('Você saiu da família.','info'); renderAll();
    }
  };
  const sa = $('syncAgora'); if (sa) sa.onclick = ()=>{ syncFull(); toast('Sincronizando…','info'); };
  const lo = $('logoutBtn'); if (lo) lo.onclick = async ()=>{
    const ok = await confirmar('Sair da conta?','Voltar ao modo offline. Dados locais permanecem.','Sair',false);
    if (ok){ if(supabase){ try{await supabase.auth.signOut();}catch(e){} } currentUser=null; offlineMode=true; supabase=null; metaSync.lastSync=null; saveState(); location.reload(); }
  };
  const en = $('entrarNuvBtn'); if (en) en.onclick = ()=>{ if (CLOUD_READY){ location.reload(); } else toast('Configure SUPABASE_URL e ANON_KEY no topo do script.','error'); };
  const ep = $('exportPdf'); if (ep) ep.onclick = ()=>{ setTab('resumo'); setTimeout(()=>window.print(), 300); };
  const ld = $('limparDados'); if (ld) ld.onclick = async ()=>{
    const ok = await confirmar('Apagar todos os dados?','Isto remove transações, metas, cartões… deste aparelho.','Apagar tudo',true);
    if (ok){ LS_KEYS.forEach(k=>localStorage.removeItem('mf_'+k)); localStorage.removeItem('mf_metaSync'); location.reload(); }
  };
}
function promptValor(msg){
  // Substituto "limpo" para prompt nativo: modal customizado simples.
  return new Promise(resolve=>{
    abrirModal(`<h2>${escapeHtml(msg)}</h2>
      <div class="field"><label>Valor (R$)</label><input id="pValor" type="number" step="0.01" min="0" autofocus></div>
      <button class="btn-block btn-teal" id="pOk">OK</button>
      <button class="btn-block btn-ghost" id="pCancel">Cancelar</button>`);
    $('pCancel').onclick = ()=>{ fecharModal(); resolve(null); };
    $('pOk').onclick = ()=>{ const v=parseFloat($('pValor').value); fecharModal(); resolve(v>0?v:null); };
  });
}
function modalPin(){
  abrirModal(`<h2>${S.profile.pin?'Alterar / remover PIN':'Definir PIN'}</h2>
    <p class="muted" style="margin-bottom:12px">O PIN tem 4 dígitos e bloqueia o app ao abrir.</p>
    <div class="field"><label>Novo PIN (4 dígitos — deixe vazio para remover)</label><input id="novoPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
    <button class="btn-block btn-teal" id="salvarPin">Salvar PIN</button>
    <button class="btn-block btn-ghost" id="cancelarPin">Cancelar</button>`);
  $('cancelarPin').onclick = fecharModal;
  $('salvarPin').onclick = ()=>{
    const p = $('novoPin').value.trim();
    if (p === ''){ S.profile.pin = null; toast('PIN removido.','success'); }
    else if (!/^\d{4}$/.test(p)){ toast('O PIN deve ter exatamente 4 dígitos.','error'); return; }
    else { S.profile.pin = p; toast('PIN definido!','success'); }
    persistAll(); fecharModal(); renderAll();
  };
}

/* ==================== 15. RECORRENTES: gera transação do mês se faltar ==================== */
function processarRecorrentes(){
  const mes = mesKey();
  (S.recurrents||[]).forEach(r=>{
    if (r.deleted_at || !r.ativo) return;
    const jaExiste = txAtivas().some(t=> t.recorrente && t.descricao===r.descricao && mesKey(t.data)===mes);
    if (jaExiste) return;
    const hoje = new Date();
    const dia = Math.min(28, r.dia_vencimento||1);
    const data = new Date(hoje.getFullYear(), hoje.getMonth(), dia).toISOString().slice(0,10);
    S.transactions.push({
      id:uid(), tipo:r.tipo||'despesa', descricao:r.descricao, valor:r.valor, data:data,
      categoria:r.categoria||'Outros', tags:[], recorrente:true, household_id:null,
      created_at:nowISO(), updated_at:nowISO(), deleted_at:null
    });
  });
}

/* ==================== 16. BOOT (splash → login/lock → app) ==================== */
function mostrarApp(){
  $('app').style.display = 'block';
  renderAll();
}
// Sincroniza ao voltar do background (visível novamente).
document.addEventListener('visibilitychange', ()=>{
  if (!document.hidden && supabase && currentUser){
    syncFull().catch(()=>{});
  }
});
// Redimensiona gráficos ao girar a tela.
window.addEventListener('resize', ()=>{ if (chartPie) chartPie.resize(); if (chartBar) chartBar.resize(); });

function boot(){
  loadState();
  processarRecorrentes();
  saveState();
  // Splash some segundos, então decide fluxo.
  setTimeout(()=>{
    $('splash').classList.add('hide');
    setTimeout(()=>{
      $('splash').style.display = 'none';
      if (supabase){
        // Verifica sessão existente.
        supabase.auth.getSession().then(({data})=>{
          if (data && data.session && data.session.user){
            currentUser = data.session.user;
            syncFull().then(aposAutenticacao).catch(aposAutenticacao);
          } else {
            mostrarLogin();
          }
        }).catch(()=> mostrarLogin());
      } else {
        // Sem chaves Supabase = 100% offline, direto para o app (ou lock se houver PIN).
        aposAutenticacao();
      }
    }, 400);
  }, 1500);
}
boot();

})(); // fim da IIFE
</script>
