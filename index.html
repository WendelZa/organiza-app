(function(){

@keyframes loadbar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
`;const s=document.createElement('style');s.textContent=css;document.head.appendChild(s);
})();
</script>

<script>

const prevYM=k=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};

const I={lock:ic('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'),plus:ic('<path d="M12 5v14M5 12h14"/>'),trash:ic('<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>'),pencil:ic('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),check:ic('<path d="M20 6 9 17l-5-5"/>'),del:ic('<path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/>'),wa:ic('<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/>'),bell:ic('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>')};

if(S.dark)document.documentElement.classList.add('dark');

const monthTotals=k=>{let r=0,d=0;const byCat={};S.tx.forEach(t=>{if(ym(t.date)===k){if(t.type==='receita')r+=t.amount;else{d+=t.amount;byCat[t.cat]=(byCat[t.cat]||0)+t.amount}}});return{r,d,byCat}};

function drawDonut(byCat){if(typeof echarts==='undefined'){setTimeout(()=>drawDonut(byCat),300);return}const el=$('#chartDonut');if(!el)return;const inst=echarts.getInstanceByDom(el)||echarts.init(el);const data=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value,itemStyle:{color:catColor(name)}}));const txt=S.dark?'#94a3b8':'#64748b';if(data.length===0){inst.clear();inst.setOption({graphic:{type:'text',left:'center',top:'middle',style:{text:'Sem despesas no mês',fill:txt,fontSize:13}}});return}inst.setOption({tooltip:{trigger:'item',formatter:p=>`${p.name}: ${fmt(p.value)} (${p.percent}%)`},legend:{bottom:0,textStyle:{color:txt,fontSize:11},type:'scroll'},series:[{type:'pie',radius:['45%','70%'],center:['50%','42%'],label:{show:false},data,emphasis:{scale:true}}]})}
function weekBounds(off){const t=new Date();const dow=t.getDay();const start=new Date(t.getFullYear(),t.getMonth(),t.getDate()-dow+off*7);const days=[];for(let i=0;i<7;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const key=dstr(d);days.push({key,label:diasSem[d.getDay()]+' '+ddmm(key)})}return{s:days[0].key,e:days[6].key,days}}
function drawBar(){if(typeof echarts==='undefined'){setTimeout(drawBar,300);return}const el=$('#chartBar');if(!el)return;const inst=echarts.getInstanceByDom(el)||echarts.init(el);const txt=S.dark?'#94a3b8':'#64748b';const line=S.dark?'#1e293b':'#e2e8f0';let labels=[],rec=[],desp=[];
if(graficoModo==='meses'){const arr=[];let k=ym();for(let i=5;i>=0;i--){arr.push(k);k=prevYM(k)}arr.reverse();arr.forEach(kk=>{const[y,m]=kk.split('-');labels.push(meses[Number(m)-1]+'/'+y.slice(2));const t=monthTotals(kk);rec.push(t.r);desp.push(t.d)})}
else if(graficoModo==='ano'){const ano=new Date().getFullYear();for(let i=0;i<12;i++){const kk=ano+'-'+String(i+1).padStart(2,'0');labels.push(meses[i]);const t=monthTotals(kk);rec.push(t.r);desp.push(t.d)}}
else{const w=weekBounds(0);w.days.forEach(d=>{labels.push(d.label);let r=0,de=0;S.tx.forEach(t=>{if(t.date===d.key){if(t.type==='receita')r+=t.amount;else de+=t.amount}});rec.push(r);desp.push(de)})}
inst.setOption({tooltip:{trigger:'axis',valueFormatter:v=>fmt(v)},legend:{textStyle:{color:txt,fontSize:11},top:0},grid:{left:8,right:8,bottom:8,top:36,containLabel:true},xAxis:{type:'category',data:labels,axisLabel:{color:txt,fontSize:10,rotate:labels.length>7?30:0},axisLine:{lineStyle:{color:line}}},yAxis:{type:'value',axisLabel:{color:txt,fontSize:10,formatter:v=>v>=1000?(v/1000)+'k':v},splitLine:{lineStyle:{color:line}}},series:[{name:'Receitas',type:'bar',data:rec,itemStyle:{color:'#059669',borderRadius:[4,4,0,0]},barMaxWidth:22},{name:'Despesas',type:'bar',data:desp,itemStyle:{color:'#e11d48',borderRadius:[4,4,0,0]},barMaxWidth:22}]})}
function drawInsights(cur){const box=$('#insightsBox');if(!box)return;const items=[];const total=cur.d;
if(total>0){const top=Object.entries(cur.byCat).sort((a,b)=>b[1]-a[1])[0];if(top)items.push(`<div class="x g2" style="padding:6px 0"><span class="chip" style="background:${catColor(top[0])}22;color:${catColor(top[0])}">Maior gasto</span><span class="sm f1"><b>${top[0]}</b> — ${fmt(top[1])} (${(top[1]/total*100).toFixed(0)}% do mês)</span></div>`)}else items.push(`<div class="sm muted" style="padding:6px 0">Nenhuma despesa registrada este mês.</div>`);
const atr=S.contas.filter(x=>!x.pago&&x.venc<todayStr());if(atr.length)items.push(`<div class="x g2" style="padding:6px 0"><span class="chip" style="background:#e11d4822;color:#e11d48">Atenção</span><span class="sm f1">${atr.length} conta(s) atrasada(s) — total ${fmt(atr.reduce((a,b)=>a+b.valor,0))}</span></div>`);
const prox=contasProximas();if(prox.length)items.push(`<div class="x g2" style="padding:6px 0"><span class="chip" style="background:#d9770622;color:#d97706">Lembrete</span><span class="sm f1">${prox.length} conta(s) vencem em até ${S.lembreteDias} dias</span></div>`);
const metasAnd=S.metas.filter(m=>m.guardado<m.alvo);if(metasAnd.length)items.push(`<div class="x g2" style="padding:6px 0"><span class="chip" style="background:#0d948822;color:#0d9488">Metas</span><span class="sm f1">${metasAnd.length} meta(s) em andamento — faltam ${fmt(metasAnd.reduce((a,b)=>a+(b.alvo-b.guardado),0))}</span></div>`);
const pend=S.recorrentes.filter(r=>!S.tx.some(t=>t.type===r.type&&t.desc===r.desc&&Math.abs(t.amount-r.amount)<0.01&&ym(t.date)===ym()));if(pend.length)items.push(`<div class="x g2" style="padding:6px 0"><span class="chip" style="background:#6366f122;color:#6366f1">Fixas</span><span class="sm f1">${pend.length} conta(s) fixa(s) pendentes</span></div>`);
box.innerHTML=`<div class="fw7 sm mb1">Insights do mês</div>`+items.join('')}
function drawRecent(){const el=$('#recentList');if(!el)return;const list=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);if(!list.length){el.innerHTML=`<div class="sm p2 muted">Nenhuma transação ainda.</div>`;return}el.innerHTML=list.map(t=>`<div class="rowitem"><span class="badge" style="background:${catColor(t.cat)}22;color:${catColor(t.cat)}">${catIni(t.cat)}</span><div class="f1"><div class="sm fw6 trunc">${t.desc}</div><div class="xs muted">${t.cat} · ${ddmm(t.date)}${t.parcN>1?` · ${t.parcI}/${t.parcN}`:''}</div></div><div class="fw7 sm" style="color:${t.type==='receita'?'var(--green)':'var(--red)'}">${t.type==='receita'?'+':'−'}${fmt(t.amount)}</div></div>`).join('')}
function renderTransacoes(c){
if(quickType){txType=quickType;quickType=null}
const cats=catDesp();
c.innerHTML=`<div class="card p4 mb4"><div class="fw7 sm mb3">${editId?'Editar transação':'Nova transação'}</div><div class="seg mb3" id="typeSeg"><button data-t="despesa" class="${txType==='despesa'?'on':''}">Despesa</button><button data-t="receita" class="${txType==='receita'?'on':''}">Receita</button></div><input id="tDesc" class="inp mb2 wfull" placeholder="Descrição" maxlength="40"><div class="g2c mb2"><input id="tAmount" class="inp wfull" type="number" step="0.01" min="0" placeholder="Valor R$"><input id="tDate" class="inp wfull" type="date" value="${todayStr()}"></div><select id="tCat" class="inp mb2 wfull"></select><label class="x ai g2 sm mb3" style="cursor:pointer"><input type="checkbox" id="tRec" style="width:18px;height:18px;accent-color:#0d9488"> Repetir todo mês (fixa)</label><div class="x ai g2 mb3"><span class="sm muted f1">Parcelas (1 = à vista)</span><input id="tParc" type="number" min="1" max="60" value="1" class="inp sm" style="width:80px"></div><button class="btn btn-primary wfull" id="tSave">${editId?'Salvar alterações':'Adicionar transação'}</button>${editId?`<button class="btn btn-ghost wfull mt2" id="tCancel">Cancelar edição</button>`:''}</div>
<div class="card p4 mb4" id="recBox"></div><div class="card p4 mb3"><input id="fQ" class="inp mb2 wfull" placeholder="Buscar descrição..."><div class="g2c"><select id="fCat" class="inp wfull"></select><select id="fPer" class="inp wfull"><option value="mes">Este mês</option><option value="passado">Mês passado</option><option value="semana">Esta semana</option><option value="semanaPass">Semana passada</option><option value="30">Últimos 30 dias</option><option value="todos">Todos os períodos</option></select></div></div><div id="txList"></div>`;

if(editId){const t=S.tx.find(x=>x.id===editId);if(t){$('#tDesc').value=t.desc;$('#tAmount').value=t.amount;$('#tDate').value=t.date;$('#tCat').value=t.cat;txType=t.type;$('#tRec').checked=S.recorrentes.some(r=>r.desc===t.desc&&Math.abs(r.amount-t.amount)<0.01);$('#tParc').value=t.parcN||1}}
c.querySelectorAll('#typeSeg button').forEach(b=>b.onclick=()=>{txType=b.dataset.t;renderTransacoes(c)});
$('#fQ').oninput=e=>{filtro.q=e.target.value;drawTxList()};$('#fCat').onchange=e=>{filtro.cat=e.target.value;drawTxList()};$('#fPer').onchange=e=>{filtro.periodo=e.target.value;drawTxList()};
$('#tSave').onclick=()=>{const desc=$('#tDesc').value.trim();const amount=parseFloat($('#tAmount').value);const date=$('#tDate').value;const cat=$('#tCat').value;const nParc=Math.max(1,Math.min(60,parseInt($('#tParc').value)||1));if(!desc||!amount||amount<=0||!date){toast('Preencha descrição, valor e data.','err');return}if(editId){const t=S.tx.find(x=>x.id===editId);Object.assign(t,{desc,amount,date,cat,type:txType});editId=null}else{const g=uid();for(let i=0;i<nParc;i++){S.tx.push({id:uid(),desc:nParc>1?`${desc} (${i+1}/${nParc})`:desc,amount,date:addMonths(date,i),cat,type:txType,parcG:nParc>1?g:null,parcI:nParc>1?i+1:1,parcN:nParc})}}if($('#tRec').checked&&!S.recorrentes.some(r=>r.desc===desc&&Math.abs(r.amount-amount)<0.01))S.recorrentes.push({id:uid(),desc,type:txType,amount,cat});persistAll();renderApp()};

function drawRecorrentes(){const box=$('#recBox');if(!box)return;if(!S.recorrentes.length){box.innerHTML=`<div class="xs muted">Marque "Repetir todo mês" numa transação para criar contas fixas.</div>`;return}const k=ym();const pend=S.recorrentes.filter(r=>!S.tx.some(t=>t.type===r.type&&t.desc===r.desc&&Math.abs(t.amount-r.amount)<0.01&&ym(t.date)===k));box.innerHTML=`<div class="x ai jb mb2"><div class="fw7 sm">Contas fixas do mês</div>${pend.length?`<button class="btn btn-primary sm" id="addAllPend">Adicionar pendentes</button>`:''}</div>`+S.recorrentes.map(r=>{const added=!pend.includes(r);return`<div class="rowitem"><span class="badge" style="background:#6366f122;color:#6366f1">FIXA</span><div class="f1"><div class="sm fw6 trunc">${r.desc}</div><div class="xs muted">${fmt(r.amount)}</div></div>${added?`<span class="badge" style="background:#05966922;color:#059669">OK</span>`:`<button class="btn btn-green sm" data-add="${r.id}">+ Lançar</button>`}<button class="btn btn-ghost icon" data-delr="${r.id}">${I.trash}</button></div>`}).join('');box.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const r=S.recorrentes.find(x=>x.id===b.dataset.add);S.tx.push({id:uid(),desc:r.desc,amount:r.amount,cat:r.cat,type:r.type,date:todayStr()});persistAll();renderApp()});box.querySelectorAll('[data-delr]').forEach(b=>b.onclick=()=>{confirmar('Remover esta conta fixa?',function(){S.recorrentes=S.recorrentes.filter(x=>x.id!==b.dataset.delr);persistAll();renderApp()})});if($('#addAllPend'))$('#addAllPend').onclick=()=>{pend.forEach(r=>S.tx.push({id:uid(),desc:r.desc,amount:r.amount,cat:r.cat,type:r.type,date:todayStr()}));persistAll();renderApp()}}
function drawTxList(){const el=$('#txList');if(!el)return;const w=weekBounds(0),wp=weekBounds(-1);const t30=new Date();t30.setDate(t30.getDate()-30);const k30=dstr(t30);let list=S.tx.filter(t=>{if(filtro.q&&!t.desc.toLowerCase().includes(filtro.q.toLowerCase()))return false;if(filtro.cat!=='Todas'&&t.cat!==filtro.cat)return false;const p=filtro.periodo;if(p==='mes'&&ym(t.date)!==ym())return false;if(p==='passado'&&ym(t.date)!==prevYM(ym()))return false;if(p==='semana'&&!(t.date>=w.s&&t.date<=w.e))return false;if(p==='semanaPass'&&!(t.date>=wp.s&&t.date<=wp.e))return false;if(p==='30'&&t.date<k30)return false;return true}).sort((a,b)=>b.date.localeCompare(a.date));if(!list.length){el.innerHTML=`<div class="card p4 sm tc muted">Nenhuma transação encontrada.</div>`;return}const totR=list.filter(t=>t.type==='receita').reduce((a,b)=>a+b.amount,0);const totD=list.filter(t=>t.type==='despesa').reduce((a,b)=>a+b.amount,0);el.innerHTML=`<div class="card p3 mb3 x ja xs"><span>Entradas: <b class="green">${fmt(totR)}</b></span><span>Saídas: <b class="red">${fmt(totD)}</b></span><span>Saldo: <b>${fmt(totR-totD)}</b></span></div>`+list.map(t=>`<div class="card p3 mb2 x ai g2"><span class="badge" style="background:${catColor(t.cat)}22;color:${catColor(t.cat)}">${catIni(t.cat)}</span><div class="f1"><div class="sm fw6 trunc">${t.desc}</div><div class="xs muted">${t.cat} · ${ddmm(t.date)}${t.parcN>1?` · parcela ${t.parcI}/${t.parcN}`:''}</div></div><div class="fw7 sm" style="color:${t.type==='receita'?'var(--green)':'var(--red)'}">${t.type==='receita'?'+':'−'}${fmt(t.amount)}</div><button class="btn btn-ghost icon" data-e="${t.id}">${I.pencil}</button><button class="btn btn-ghost icon" data-x="${t.id}">${I.trash}</button></div>`).join('');el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{editId=b.dataset.e;aba='transacoes';renderApp()});el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const t=S.tx.find(x=>x.id===b.dataset.x);const delUma=function(){S.tx=S.tx.filter(x=>x.id!==b.dataset.x);persistAll();renderApp()};if(t&&t.parcN>1){confirmar('Excluir TODAS as parcelas deste grupo? (Cancelar = só esta parcela)',function(){S.tx=S.tx.filter(x=>x.parcG!==t.parcG);persistAll();renderApp()});return}confirmar('Excluir transação?',delUma)})}
function renderOrcamento(c){const cats=catDesp();const k=ym();const cur=monthTotals(k);const hoje=new Date();const diaAtual=hoje.getDate();const diasNoMes=new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate();const saldoMes=cur.r-cur.d;const totalTeto=cats.reduce((a,cat)=>a+(parseFloat(S.bg[k+'_'+cat])||0),0);const rows=cats.map(cat=>{const gasto=cur.byCat[cat]||0;const teto=parseFloat(S.bg[k+'_'+cat])||0;const avg=catAvg3(cat);const proj=diaAtual>0?gasto/diaAtual*diasNoMes:0;const pct=teto>0?Math.min(gasto/teto*100,100):0;let cor='#059669',status='No controle';if(teto<=0){cor='var(--muted)';status='Sem teto'}else if(gasto>teto){cor='#e11d48';status='Estourou'}else if(proj>teto){cor='#d97706';status='Projeção acima'}return`<div class="card p3 mb2"><div class="x ai jb mb2"><div class="x ai g2"><span class="dot" style="background:${catColor(cat)}"></span><span class="sm fw6">${cat}</span><span class="badge" style="background:${cor}22;color:${cor}">${status}</span></div><div class="xs fw6 x ai g2">${fmt(gasto)} / <input type="number" min="0" step="10" class="inp sm tr" style="width:84px" data-lim="${cat}" value="${teto||''}" placeholder="teto"></div></div><div class="prog mb1"><div style="width:${pct}%;background:${cor}"></div></div><div class="xs x jb muted"><span>Média 3 meses: ${fmt(avg)}</span><span>Projeção: ${fmt(proj)}</span></div>${teto>0&&gasto>teto?`<div class="xs mt1 fw6 red">Ultrapassou o teto em ${fmt(gasto-teto)}</div>`:''}</div>`}).join('');const econPct=S.metaEcon>0?Math.max(0,Math.min(saldoMes/S.metaEcon*100,100)):0;c.innerHTML=`<div class="r24 p4 mb4 white" style="background:linear-gradient(135deg,#0f766e,#0d9488)"><div class="x ai jb mb2"><div class="fw7 sm">Meta de economia do mês</div><div class="xs op80">${fmt(saldoMes)} guardado</div></div><div class="prog mb2" style="background:rgba(255,255,255,.25)"><div style="width:${econPct}%;background:#fff"></div></div><div class="x ai g2"><span class="xs op80 f1">Meta: R$</span><input type="number" min="0" step="50" id="metaEconInp" class="inp sm tr" style="width:130px;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff" value="${S.metaEcon||''}" placeholder="0,00"></div>${S.metaEcon>0?`<div class="xs mt1 op80">${econPct.toFixed(0)}% da meta · faltam ${fmt(Math.max(0,S.metaEcon-saldoMes))}</div>`:''}</div><div class="card p3 mb3 x ja xs"><span>Teto total: <b>${fmt(totalTeto)}</b></span><span>Gasto: <b class="red">${fmt(cur.d)}</b></span><span>Disp.: <b class="green">${fmt(totalTeto-cur.d)}</b></span></div>${rows}`;c.querySelectorAll('[data-lim]').forEach(inp=>inp.onchange=e=>{const v=parseFloat(e.target.value)||0;S.bg[k+'_'+inp.dataset.lim]=v;save('finapp_bg',S.bg);renderApp()});$('#metaEconInp').onchange=e=>{S.metaEcon=parseFloat(e.target.value)||0;localStorage.setItem('finapp_metaEcon',S.metaEcon);renderApp()}}
function renderMetas(c){c.innerHTML=`<div class="card p4 mb4"><div class="fw7 sm mb3">Nova meta de economia</div><input id="mNome" class="inp mb2 wfull" placeholder="Nome da meta (ex: Viagem)" maxlength="30"><div class="g2c mb3"><input id="mAlvo" class="inp wfull" type="number" min="0" step="50" placeholder="Valor alvo R$"><input id="mPrazo" class="inp wfull" type="month" title="Prazo (opcional)"></div><button class="btn btn-primary wfull" id="mAdd">${I.plus} Criar meta</button></div><div id="metaList"></div>`;$('#mAdd').onclick=()=>{const n=$('#mNome').value.trim();const a=parseFloat($('#mAlvo').value);if(!n||!a||a<=0){toast('Preencha nome e valor alvo.','err');return}S.metas.push({id:uid(),nome:n,alvo:a,prazo:$('#mPrazo').value||'',guardado:0});persistAll();renderApp()};const el=$('#metaList');if(!S.metas.length){el.innerHTML=`<div class="card p4 sm tc muted">Nenhuma meta criada ainda.</div>`;return}el.innerHTML=S.metas.map(m=>{const pct=Math.min(m.guardado/m.alvo*100,100);const done=m.guardado>=m.alvo;return`<div class="card p4 mb3"><div class="x ai jb mb2"><div class="fw7 sm">${m.nome} ${done?'<span class="badge" style="background:#05966922;color:#059669">Concluída</span>':''}</div><button class="btn btn-ghost icon" data-dm="${m.id}">${I.trash}</button></div><div class="xs mb1 muted">${fmt(m.guardado)} de ${fmt(m.alvo)} · ${pct.toFixed(0)}%${m.prazo?` · até ${m.prazo}`:''}</div><div class="prog mb2"><div style="width:${pct}%;background:${done?'#059669':'linear-gradient(90deg,#0f766e,#14b8a6)'}"></div></div>${!done?`<div class="xs mb2 muted">Faltam ${fmt(m.alvo-m.guardado)}</div><div class="x g2"><input type="number" min="0" step="10" class="inp sm f1" id="add_${m.id}" placeholder="Adicionar valor"><button class="btn btn-green sm" data-addm="${m.id}">+ Adicionar</button></div>`:''}</div>`}).join('');el.querySelectorAll('[data-addm]').forEach(b=>b.onclick=()=>{const v=parseFloat(document.getElementById('add_'+b.dataset.addm).value);if(!v||v<=0)return;const m=S.metas.find(x=>x.id===b.dataset.addm);m.guardado+=v;persistAll();renderApp()});el.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{confirmar('Excluir meta?',function(){S.metas=S.metas.filter(x=>x.id!==b.dataset.dm);persistAll();renderApp()})})}
function renderContas(c){const hoje=todayStr();const pend=S.contas.filter(x=>!x.pago);const atr=pend.filter(x=>x.venc<hoje);const totPend=pend.reduce((a,b)=>a+b.valor,0);const totAtr=atr.reduce((a,b)=>a+b.valor,0);const proximas=contasProximas();c.innerHTML=`<div class="g2c mb4"><div class="card p3"><div class="xs muted">A pagar</div><div class="lg fw8">${fmt(totPend)}</div></div><div class="card p3" style="${totAtr>0?'border-color:var(--red)':''}"><div class="xs muted">Atrasadas</div><div class="lg fw8" style="color:${totAtr>0?'var(--red)':'var(--green)'}">${fmt(totAtr)}</div></div></div>${proximas.length?`<div class="alertcard"><div class="xs fw6 orange mb1">${I.bell} ${proximas.length} conta(s) vencem em até ${S.lembreteDias} dias</div>${proximas.map(x=>`<div class="xs">${x.desc} — ${ddmm(x.venc)}</div>`).join('')}</div>`:''}<div class="card p4 mb4"><div class="fw7 sm mb3">Nova conta</div><input id="cDesc" class="inp mb2 wfull" placeholder="Descrição (ex: Aluguel)" maxlength="30"><div class="g2c mb3"><input id="cVal" class="inp wfull" type="number" min="0" step="10" placeholder="Valor R$"><input id="cVenc" class="inp wfull" type="date" value="${hoje}"></div><button class="btn btn-primary wfull" id="cAdd">${I.plus} Adicionar conta</button></div><div id="cList"></div>`;$('#cAdd').onclick=()=>{const d=$('#cDesc').value.trim();const v=parseFloat($('#cVal').value);const ve=$('#cVenc').value;if(!d||!v||v<=0||!ve){toast('Preencha todos os campos.','err');return}S.contas.push({id:uid(),desc:d,valor:v,venc:ve,pago:false});persistAll();renderApp()};const el=$('#cList');if(!S.contas.length){el.innerHTML=`<div class="card p4 sm tc muted">Nenhuma conta cadastrada.</div>`;return}const list=[...S.contas].sort((a,b)=>a.pago-b.pago||a.venc.localeCompare(b.venc));el.innerHTML=list.map(x=>{let st='A vencer',cor='#d97706';if(x.pago){st='Paga';cor='#059669'}else if(x.venc<hoje){st='Atrasada';cor='#e11d48'}else if(x.venc===hoje){st='Vence hoje';cor='#d97706'}else if(proximas.some(p=>p.id===x.id)){st='Vence em breve';cor='#d97706'}return`<div class="card p3 mb2 x ai g2"><button class="btn ${x.pago?'btn-green':'btn-ghost'} icon" data-pg="${x.id}">${x.pago?I.check:''}</button><div class="f1"><div class="sm fw6 trunc ${x.pago?'through op60':''}">${x.desc}</div><div class="xs muted">Vence ${ddmm(x.venc)}</div></div><span class="badge" style="background:${cor}22;color:${cor}">${st}</span><div class="fw7 sm">${fmt(x.valor)}</div><button class="btn btn-ghost icon" data-xc="${x.id}">${I.trash}</button></div>`}).join('');el.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{const x=S.contas.find(v=>v.id===b.dataset.pg);x.pago=!x.pago;persistAll();renderApp()});el.querySelectorAll('[data-xc]').forEach(b=>b.onclick=()=>{confirmar('Excluir conta?',function(){S.contas=S.contas.filter(x=>x.id!==b.dataset.xc);persistAll();renderApp()})})}
function renderMercado(c){c.innerHTML=`<div class="card p4 mb4"><div class="fw7 sm mb3">Adicionar item <span class="xs muted">— apenas o nome é obrigatório</span></div><div class="x g2"><input id="mkNome" class="inp f1" placeholder="Nome do produto" maxlength="30"><input id="mkQtd" class="inp" style="width:72px" type="number" min="1" value="1" title="Quantidade"><button class="btn btn-primary" style="padding:12px 16px" id="mkAdd">${I.plus}</button></div></div><div id="mkList"></div>`;$('#mkAdd').onclick=()=>{const n=$('#mkNome').value.trim();const q=parseInt($('#mkQtd').value)||1;if(!n){toast('Digite o nome do produto.','err');return}S.mk.push({id:uid(),nome:n,qtd:q,comprado:false});save('finapp_mk',S.mk);renderApp()};$('#mkNome').onkeydown=e=>{if(e.key==='Enter')$('#mkAdd').click()};const el=$('#mkList');if(!S.mk.length){el.innerHTML=`<div class="card p6 tc sm muted">Sua lista está vazia.<br>Adicione os produtos que precisa comprar.</div>`;return}const comprados=S.mk.filter(x=>x.comprado).length;el.innerHTML=`<div class="card p3 mb3 x ai jb sm"><span><b>${comprados}</b> de <b>${S.mk.length}</b> comprados</span><div class="prog" style="width:96px"><div style="width:${S.mk.length?comprados/S.mk.length*100:0}%;background:linear-gradient(90deg,#0f766e,#14b8a6)"></div></div>${comprados>0?`<button class="btn btn-ghost sm" id="mkLimp">Limpar comprados</button>`:''}</div>`+S.mk.map(x=>`<div class="card p3 mb2 x ai g2"><button class="btn ${x.comprado?'btn-green':'btn-ghost'} icon" data-mk="${x.id}">${x.comprado?I.check:''}</button><div class="f1 ${x.comprado?'through op50':''}"><span class="sm fw6">${x.nome}</span>${x.qtd>1?`<span class="xs muted" style="margin-left:8px">qtd: ${x.qtd}</span>`:''}</div><button class="btn btn-ghost icon" data-xm="${x.id}">${I.trash}</button></div>`).join('');el.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{const x=S.mk.find(v=>v.id===b.dataset.mk);x.comprado=!x.comprado;save('finapp_mk',S.mk);renderApp()});el.querySelectorAll('[data-xm]').forEach(b=>b.onclick=()=>{S.mk=S.mk.filter(x=>x.id!==b.dataset.xm);save('finapp_mk',S.mk);renderApp()});if($('#mkLimp'))$('#mkLimp').onclick=()=>{S.mk=S.mk.filter(x=>!x.comprado);save('finapp_mk',S.mk);renderApp()}}
function renderAjustes(c){c.innerHTML=`<div class="card p4 mb4"><div class="fw7 sm mb3">Conta e segurança</div><div class="x ai g3 mb3"><div class="av grad" style="width:48px;height:48px;font-size:20px">${(S.nome||'?')[0].toUpperCase()}</div><div><div class="fw6 sm">${S.nome||'—'}</div><div class="xs muted">PIN: ${S.pin?'Ativado':'Desativado'}</div></div></div><button class="btn btn-ghost wfull mb2" id="altNome">Alterar nome</button><button class="btn btn-ghost wfull mb2" id="altPin">${S.pin?'Alterar PIN':'Ativar PIN'}</button>${S.pin?`<button class="btn btn-ghost wfull" id="offPin">Desativar PIN</button>`:''}</div>
<div class="card p4 mb4 x ai jb"><div><div class="fw7 sm">Modo escuro</div><div class="xs muted">${S.dark?'LIGADO':'DESLIGADO'}</div></div><button class="sw ${S.dark?'on':''}" id="swDark"></button></div>
<div class="card p4 mb4"><div class="fw7 sm mb3">Lembretes de vencimento</div><div class="x ai g2 mb3"><span class="sm f1">Avisar com quantos dias de antecedência</span><input type="number" min="1" max="30" id="lembreteInp" class="inp sm tr" style="width:72px" value="${S.lembreteDias}"></div><div class="x ai jb"><div><div class="sm fw6">Notificações do celular</div><div class="xs muted">${S.notif?'Ativadas':'Desativadas'}</div></div><button class="sw ${S.notif?'on':''}" id="swNotif"></button></div></div>
<div class="card p4 mb4"><div class="fw7 sm mb2">Câmbio (USD / EUR)</div><p class="xs muted mb3">Edite as cotações usadas no resumo (1 moeda = quantos R$).</p><div class="g2c mb2"><div><label class="xs fw6">1 USD em R$</label><input type="number" step="0.01" min="0" class="inp wfull mt1" id="usdInp" value="${S.cambio.USD}"></div><div><label class="xs fw6">1 EUR em R$</label><input type="number" step="0.01" min="0" class="inp wfull mt1" id="eurInp" value="${S.cambio.EUR}"></div></div><button class="btn btn-primary wfull" id="saveCambio">Salvar cotações</button></div>
<div class="card p4 mb4"><div class="fw7 sm mb3">Categorias personalizadas</div><div class="x g2 mb3"><input id="newCat" class="inp f1" placeholder="Nova categoria" maxlength="20"><button class="btn btn-primary" style="padding:11px 16px" id="addCat">${I.plus}</button></div><div id="catList" class="x wrap g2"></div></div>
<div class="card p4 mb4"><div class="fw7 sm mb3">Seus dados</div><button class="btn btn-green wfull mb2" id="waBtn">${I.wa} Compartilhar resumo no WhatsApp</button><button class="btn btn-ghost wfull mb2" id="expJson">Exportar JSON (backup)</button><button class="btn btn-ghost wfull mb2" id="expCsv">Exportar transações (CSV)</button><label class="btn btn-ghost wfull mb2" style="cursor:pointer">Importar JSON<input type="file" id="impJson" accept=".json" class="hide"></label><button class="btn btn-red wfull" id="clearAll">Apagar todos os dados</button></div>
<div class="tc xs p2 muted">Organiza APP · Versão 1.2 · Lançamento<br>Dica: no celular, menu do navegador → "Adicionar à tela inicial".</div>`;
$('#swDark').onclick=()=>{S.dark=!S.dark;localStorage.setItem('finapp_dark',S.dark?'1':'0');document.documentElement.classList.toggle('dark',S.dark);renderApp()};
$('#altNome').onclick=()=>{const n=prompt('Novo nome:',S.nome);if(n&&n.trim()){S.nome=n.trim();localStorage.setItem('finapp_nome',S.nome);renderApp()}};
$('#altPin').onclick=()=>{const p=prompt('Novo PIN de 4 dígitos:');if(p&&/^\d{4}$/.test(p)){S.pin=hashPIN(p);localStorage.setItem('finapp_pin',S.pin);toast('PIN atualizado!','ok');renderApp()}else if(p)toast('Precisa ser 4 dígitos numéricos.','err')};
if($('#offPin'))$('#offPin').onclick=()=>{confirmar('Desativar PIN?',function(){S.pin='';localStorage.setItem('finapp_pin','');renderApp()})};
$('#lembreteInp').onchange=e=>{S.lembreteDias=Math.max(1,Math.min(30,parseInt(e.target.value)||3));localStorage.setItem('finapp_lembreteDias',S.lembreteDias);renderApp()};
$('#swNotif').onclick=()=>{try{if(!S.notif){if(!('Notification'in window)){toast('Notificações não suportadas neste navegador.','err');return}if(Notification.permission==='granted'){S.notif=true}else Notification.requestPermission().then(p=>{S.notif=(p==='granted');localStorage.setItem('finapp_notif',S.notif?'1':'0');renderApp()})}else S.notif=false;localStorage.setItem('finapp_notif',S.notif?'1':'0');renderApp()}catch(e){toast('Não foi possível ativar notificações.','err')}};
$('#saveCambio').onclick=()=>{S.cambio.USD=parseFloat($('#usdInp').value)||S.cambio.USD;S.cambio.EUR=parseFloat($('#eurInp').value)||S.cambio.EUR;save('finapp_cambio',S.cambio);toast('Cotações salvas!','ok');renderApp()};
$('#addCat').onclick=()=>{const n=$('#newCat').value.trim();if(!n)return;if(CAT_DESP.includes(n)||S.catCustom.includes(n)){toast('Categoria já existe.','err');return}S.catCustom.push(n);save('finapp_catCustom',S.catCustom);renderApp()};
const cl=$('#catList');cl.innerHTML=S.catCustom.map(c2=>`<span class="chip" style="background:${catColor(c2)}22;color:${catColor(c2)}">${c2} <button data-xcat="${c2}" style="background:none;border:none;color:inherit;cursor:pointer;font-weight:700;padding:0 2px">×</button></span>`).join('')||`<span class="xs muted">Nenhuma categoria personalizada.</span>`;cl.querySelectorAll('[data-xcat]').forEach(b=>b.onclick=()=>{confirmar('Remover categoria? Transações existentes permanecem.',function(){S.catCustom=S.catCustom.filter(x=>x!==b.dataset.xcat);save('finapp_catCustom',S.catCustom);renderApp()})});
$('#waBtn').onclick=()=>{const k=ym();const t=monthTotals(k);const top=Object.entries(t.byCat).sort((a,b)=>b[1]-a[1])[0];const atr=S.contas.filter(x=>!x.pago&&x.venc<todayStr()).reduce((a,b)=>a+b.valor,0);const msg=`Resumo de ${mesesFull[new Date().getMonth()]} (Organiza APP)\nReceitas: ${fmt(t.r)}\nDespesas: ${fmt(t.d)}\nSaldo: ${fmt(t.r-t.d)}\nMaior gasto: ${top?top[0]+' ('+fmt(top[1])+')':'-'}\nContas atrasadas: ${fmt(atr)}\nDólar: 1 USD = ${fmt(S.cambio.USD)}`;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')};
$('#expJson').onclick=()=>{const data={tx:S.tx,mk:S.mk,bg:S.bg,metas:S.metas,contas:S.contas,catCustom:S.catCustom,recorrentes:S.recorrentes,cambio:S.cambio,metaEcon:S.metaEcon,lembreteDias:S.lembreteDias,nome:S.nome};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minhas-financas-backup.json';a.click()};
$('#expCsv').onclick=()=>{let csv='\uFEFFData,Descricao,Tipo,Categoria,Valor,Parcela\n';S.tx.forEach(t=>{csv+=`${t.date},"${t.desc}",${t.type},"${t.cat}",${t.amount.toString().replace('.',',')},${t.parcN>1?`${t.parcI}/${t.parcN}`:''}\n`});const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='transacoes.csv';a.click()};
$('#impJson').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tx)throw 0;Object.assign(S,{tx:d.tx,mk:d.mk||[],bg:d.bg||{},metas:d.metas||[],contas:d.contas||[],catCustom:d.catCustom||[],recorrentes:d.recorrentes||[],cambio:d.cambio||S.cambio,metaEcon:d.metaEcon||0,lembreteDias:d.lembreteDias||S.lembreteDias});if(d.nome){S.nome=d.nome;localStorage.setItem('finapp_nome',d.nome)}persistAll();toast('Dados importados!','ok');renderApp()}catch(err){toast('Arquivo inválido.','err')}};r.readAsText(f)};
$('#clearAll').onclick=()=>{confirmar('Tem certeza? TODOS os dados serão apagados. Esta ação não pode ser desfeita.',function(){confirmar('Confirma novamente a exclusão de TUDO?',function(){localStorage.clear();location.reload()})})};
}
setTimeout(function(){const sp=document.getElementById('splash');if(sp){sp.className+=' hide';setTimeout(function(){if(sp)sp.remove()},400)}renderLogin()},1800);
})();
</script>
</body>
</html>
